          </div>
          <div style="display:flex;gap:6px;">
            <button class="cal-nav-btn" onclick="showAgentForm(agentsData.find(x=>x.id==='${a.id}'))">編集</button>
            <button class="cal-nav-btn" style="color:#dc2626;border-color:#fecaca;" onclick="deleteAgent('${a.id}')">削除</button>
          </div>
        </div>
        <div style="margin-bottom:16px;">
          <label style="font-size:13px;font-weight:600;color:#374151;">担当エリア</label>
          <div style="margin-top:4px;">${getAreaNames(a.area) || '<span style="color:#94a3b8">未設定</span>'}</div>
        </div>
        <h4 style="font-size:15px;margin-bottom:8px;color:#374151;">担当物件</h4>
        <div id="agent-props-container"><p style="color:#94a3b8;font-size:13px;">読み込み中...</p></div>
      </div>`;
      // Load properties
      const res = await fetch(`/api/agents/${id}/properties`);
      const props = await res.json();
      const container = document.getElementById("agent-props-container");
      if (!props.length) { container.innerHTML = '<p style="color:#94a3b8;font-size:13px;">担当エリア内に物件がありません</p>'; return; }
      container.innerHTML = `<table class="agent-props-table">
        <thead><tr><th>物件名</th><th>エリア</th><th>住所</th><th>賃料</th><th>面積</th><th>メモ</th></tr></thead>
        <tbody>${props.map(p => `<tr>
          <td>${esc(p.name)}</td>
          <td>${esc(p._wsName || "")}</td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(p.address)}</td>
          <td>${esc((p.details && p.details["賃料"]) || "-")}</td>
          <td>${esc((p.details && p.details["面積"]) || "-")}</td>
          <td style="max-width:250px;white-space:pre-wrap;font-size:12px;color:#64748b;">${esc(p.memo || "-")}</td>
        </tr>`).join("")}</tbody>
      </table>`;
    }

    function showAgentForm(agent) {
      selectedAgentId = agent ? agent.id : null;
      renderAgentLeftPanel();
      agentFormAreaIds = agent && agent.area ? agent.area.split(",").filter(x => x.trim()) : [];
      const right = document.getElementById("agent-right");
      right.innerHTML = `<div style="max-width:600px;">
        <h3 style="font-size:18px;margin-bottom:16px;">${agent ? "エージェント編集" : "新規エージェント登録"}</h3>
        <input type="hidden" id="agent-edit-id" value="${agent ? agent.id : ""}">
        <label>名前 <span style="color:#dc2626">*</span></label>
        <input type="text" id="agent-name" value="${agent ? esc(agent.name) : ""}" placeholder="例: 田中太郎">
        <label>メールアドレス <span style="color:#dc2626">*</span></label>
        <input type="text" id="agent-email" value="${agent ? esc(agent.email) : ""}" placeholder="例: tanaka@example.com">
        <label>電話番号</label>
        <input type="text" id="agent-phone" value="${agent ? esc(agent.phone || "") : ""}" placeholder="例: 03-1234-5678">
        <label>担当エリア（クリックで選択）</label>
        <div class="area-chips" id="area-chips"></div>
        <label style="margin-top:12px;">備考</label>
        <input type="text" id="agent-memo" value="${agent ? esc(agent.memo || "") : ""}" placeholder="メモ">
        <div id="agent-status" class="loading" style="display:none"></div>
        <div class="btn-row" style="margin-top:16px;">
          <button class="btn btn-secondary" onclick="selectedAgentId?showAgentDetail(selectedAgentId):closeAgentView()">キャンセル</button>
          <button class="btn btn-primary" onclick="saveAgent()">保存</button>
        </div>
      </div>`;
      renderAreaChips();
    }

    function renderAreaChips() {
      const container = document.getElementById("area-chips");
      if (!container) return;
      container.innerHTML = workspacesData.workspaces.map(ws => {
        const active = agentFormAreaIds.includes(ws.id);
        return `<span class="area-chip${active ? " active" : ""}" data-wsid="${ws.id}" onclick="toggleAreaChip('${ws.id}')">${esc(ws.name)}</span>`;
      }).join("");
    }

    function toggleAreaChip(wsId) {
      const idx = agentFormAreaIds.indexOf(wsId);
      if (idx >= 0) agentFormAreaIds.splice(idx, 1);
      else agentFormAreaIds.push(wsId);
      renderAreaChips();
    }

    async function saveAgent() {
      const editId = document.getElementById("agent-edit-id").value;
      const data = {
        name: document.getElementById("agent-name").value.trim(),
        email: document.getElementById("agent-email").value.trim(),
        phone: document.getElementById("agent-phone").value.trim(),
        area: agentFormAreaIds.join(","),
        memo: document.getElementById("agent-memo").value.trim(),
      };
      const status = document.getElementById("agent-status");
      if (!data.name || !data.email) { status.style.display = "block"; status.textContent = "名前とメールアドレスは必須です"; status.style.color = "#dc2626"; return; }
      const url = editId ? `/api/agents/${editId}` : "/api/agents";
      const method = editId ? "PUT" : "POST";
      const res = await fetch(url, { method, headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
      const result = await res.json();
      if (result.status === "ok") {
        await loadAgents(); renderAgentLeftPanel();
        if (editId) showAgentDetail(editId);
        else showAgentForm();
      } else { status.style.display = "block"; status.textContent = result.message || "エラー"; status.style.color = "#dc2626"; }
    }

    async function deleteAgent(id) {
      const a = agentsData.find(x => x.id === id);
      if (!confirm(`${a?.name}を削除しますか？`)) return;
      await fetch(`/api/agents/${id}`, { method: "DELETE" });
      await loadAgents(); renderAgentLeftPanel(); showAgentForm();
    }

    // === Calendar / Schedules ===
    let schedulesData = [];
    let calViewMode = "month"; // month | week
    let calDate = new Date(); // current focused date

    async function loadSchedules(month) {
      const res = await fetch(`/api/schedules?month=${month}`);
      schedulesData = await res.json();
    }

    function openCalendar() {
      calDate = new Date();
      document.getElementById("calendar-view").classList.add("active");
      renderCalendar();
    }
    function closeCalendar() { document.getElementById("calendar-view").classList.remove("active"); }

    function calNav(dir) {
      if (calViewMode === "month") calDate.setMonth(calDate.getMonth() + dir);
      else calDate.setDate(calDate.getDate() + dir * 7);
      renderCalendar();
    }
    function calToday() { calDate = new Date(); renderCalendar(); }
    function setCalView(mode) {
      calViewMode = mode;
      document.getElementById("cal-month-btn").classList.toggle("active", mode === "month");
      document.getElementById("cal-week-btn").classList.toggle("active", mode === "week");
      renderCalendar();
    }

    async function renderCalendar() {
      const y = calDate.getFullYear(), m = calDate.getMonth();
      const month = `${y}-${String(m+1).padStart(2,"0")}`;
      await loadSchedules(month);
      await loadAgents();
      document.getElementById("cal-title").textContent = `${y}年${m+1}月`;
      document.getElementById("cal-month-btn").classList.toggle("active", calViewMode === "month");
      document.getElementById("cal-week-btn").classList.toggle("active", calViewMode === "week");

      const headers = document.getElementById("cal-day-headers");
      headers.innerHTML = ["日","月","火","水","木","金","土"].map(d => `<div class="cal-header">${d}</div>`).join("");

      if (calViewMode === "month") renderMonthView(y, m);
      else renderWeekView();
    }

    function renderMonthView(y, m) {
      const body = document.getElementById("cal-body");
      const first = new Date(y, m, 1), last = new Date(y, m+1, 0);
      const startDay = first.getDay();
      const today = new Date(); const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
      let html = '<div class="cal-grid">';
      // Previous month padding
      const prevLast = new Date(y, m, 0).getDate();
      for (let i = startDay - 1; i >= 0; i--) {
        const d = prevLast - i;
        html += `<div class="cal-day other-month"><div class="cal-day-num">${d}</div></div>`;
      }
      // Current month
      for (let d = 1; d <= last.getDate(); d++) {
        const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const isToday = dateStr === todayStr;
        const events = schedulesData.filter(s => s.date === dateStr);
        html += `<div class="cal-day${isToday ? " today" : ""}" onclick="openScheduleModal('${dateStr}')">`;
        html += `<div class="cal-day-num">${d}</div>`;
        for (const ev of events) {
          const agent = agentsData.find(a => a.id === ev.agentId);
          html += `<div class="cal-event type-${ev.type}" onclick="event.stopPropagation();editSchedule('${ev.id}')" title="${esc(ev.title)}">${ev.startTime} ${esc(ev.title)}${agent ? " ("+esc(agent.name)+")" : ""}</div>`;
        }
        html += `</div>`;
      }
      // Next month padding
      const totalCells = startDay + last.getDate();
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let i = 1; i <= remaining; i++) {
        html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
      }
      html += '</div>';
      body.innerHTML = html;
    }

    function renderWeekView() {
      const body = document.getElementById("cal-body");
      const d = new Date(calDate);
      d.setDate(d.getDate() - d.getDay()); // Start of week (Sunday)
      const weekDates = [];
      for (let i = 0; i < 7; i++) {
        const dt = new Date(d);
        dt.setDate(d.getDate() + i);
        weekDates.push(dt);
      }
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;
      let html = '<div class="cal-week">';
      // Header row
      html += '<div></div>';
      for (const wd of weekDates) {
        const ds = `${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,"0")}-${String(wd.getDate()).padStart(2,"0")}`;
        html += `<div class="cal-header" style="${ds===todayStr?'color:#2563eb;font-weight:700;':''}">${wd.getMonth()+1}/${wd.getDate()}</div>`;
      }
      // Time rows (8-20)
      for (let h = 8; h <= 20; h++) {
        html += `<div class="cal-week-time">${h}:00</div>`;
        for (const wd of weekDates) {
          const ds = `${wd.getFullYear()}-${String(wd.getMonth()+1).padStart(2,"0")}-${String(wd.getDate()).padStart(2,"0")}`;
          const events = schedulesData.filter(s => s.date === ds && parseInt(s.startTime) === h);
          let evHtml = "";
          for (const ev of events) {
            evHtml += `<div class="cal-week-event type-${ev.type}" onclick="event.stopPropagation();editSchedule('${ev.id}')">${esc(ev.title)}</div>`;
          }
          html += `<div class="cal-week-cell" onclick="openScheduleModal('${ds}')">${evHtml}</div>`;
        }
      }
      html += '</div>';
      body.innerHTML = html;
    }

    // === Schedule Modal ===
    function openScheduleModal(dateStr) {
      document.getElementById("sch-edit-id").value = "";
      document.getElementById("schedule-modal-title").textContent = "予定を追加";
      document.getElementById("sch-title").value = "";
      document.getElementById("sch-type").value = "内見";
      document.getElementById("sch-date").value = dateStr || new Date().toISOString().slice(0,10);
      document.getElementById("sch-start").value = "10:00";
      document.getElementById("sch-end").value = "11:00";
      document.getElementById("sch-memo").value = "";
      document.getElementById("sch-status").style.display = "none";
      document.getElementById("sch-gcal-link").style.display = "none";
      // Populate agent dropdown
      const agentSel = document.getElementById("sch-agent");
      agentSel.innerHTML = '<option value="">選択なし</option>' + agentsData.map(a => `<option value="${a.id}">${esc(a.name)} (${esc(a.company||"")})</option>`).join("");
      // Populate property dropdown
      const propSel = document.getElementById("sch-property");
      propSel.innerHTML = '<option value="">選択なし</option>' + properties.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("");
      document.getElementById("schedule-modal").classList.add("active");
    }

    function editSchedule(id) {
      const s = schedulesData.find(x => x.id === id);
      if (!s) return;
      openScheduleModal(s.date);
      document.getElementById("sch-edit-id").value = id;
      document.getElementById("schedule-modal-title").textContent = "予定を編集";
      document.getElementById("sch-title").value = s.title;
      document.getElementById("sch-type").value = s.type;
      document.getElementById("sch-start").value = s.startTime;
      document.getElementById("sch-end").value = s.endTime;
      document.getElementById("sch-agent").value = s.agentId || "";
      document.getElementById("sch-property").value = s.propertyId || "";
      document.getElementById("sch-memo").value = s.memo || "";
      updateGcalLink();
    }

    function closeScheduleModal() { document.getElementById("schedule-modal").classList.remove("active"); }

    function updateGcalLink() {
      const title = document.getElementById("sch-title").value.trim();
      const date = document.getElementById("sch-date").value;
      const start = document.getElementById("sch-start").value;
      const end = document.getElementById("sch-end").value;
      const agentId = document.getElementById("sch-agent").value;
      const link = document.getElementById("sch-gcal-link");
      if (!title || !date) { link.style.display = "none"; return; }
      const startDt = date.replace(/-/g,"") + "T" + start.replace(":","") + "00";
      const endDt = date.replace(/-/g,"") + "T" + end.replace(":","") + "00";
      const agent = agentsData.find(a => a.id === agentId);
      const propId = document.getElementById("sch-property").value;
      const prop = properties.find(p => p.id === propId);
      let details = document.getElementById("sch-type").value;
      if (prop) details += " - " + prop.name + " (" + prop.address + ")";
      let url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${startDt}/${endDt}&details=${encodeURIComponent(details)}`;
      if (agent) url += `&add=${encodeURIComponent(agent.email)}`;
      link.href = url;
      link.style.display = "inline-block";
    }

    async function saveSchedule() {
      const editId = document.getElementById("sch-edit-id").value;
      const data = {
        title: document.getElementById("sch-title").value.trim(),
        type: document.getElementById("sch-type").value,
        date: document.getElementById("sch-date").value,
        startTime: document.getElementById("sch-start").value,
        endTime: document.getElementById("sch-end").value,
        agentId: document.getElementById("sch-agent").value,
        propertyId: document.getElementById("sch-property").value,
        memo: document.getElementById("sch-memo").value.trim(),
      };
      const status = document.getElementById("sch-status");
      if (!data.title || !data.date) { status.style.display = "block"; status.textContent = "タイトルと日付は必須です"; status.style.color = "#dc2626"; return; }
      const url = editId ? `/api/schedules/${editId}` : "/api/schedules";
      const method = editId ? "PUT" : "POST";
      const res = await fetch(url, { method, headers: {"Content-Type":"application/json"}, body: JSON.stringify(data) });
      const result = await res.json();
      if (result.status === "ok") { closeScheduleModal(); renderCalendar(); }
      else { status.style.display = "block"; status.textContent = result.message || "エラー"; status.style.color = "#dc2626"; }
    }

    // Auto-update gcal link when form changes
    document.addEventListener("input", e => {
      if (e.target.closest("#schedule-modal")) updateGcalLink();
    });
    document.addEventListener("change", e => {
      if (e.target.closest("#schedule-modal")) updateGcalLink();
    });

    // === Real-time sync (polling) ===
    let _lastSyncTs = 0;
    async function syncTs() {
      // Update timestamp after own change so poll doesn't trigger reload
      try { const r = await fetch("/api/sync"); const d = await r.json(); _lastSyncTs = d.ts; } catch(e) {}
    }
    async function pollSync() {
      try {
        const res = await fetch("/api/sync");
        const data = await res.json();
        if (_lastSyncTs > 0 && data.ts > _lastSyncTs) {
          // Data changed by another user - reload
          const openPropId = selectedPropId;
          await loadProperties();
          await loadAgents();
          renderMarkers();
          if (currentView === "list") renderListView();
          // Re-open sidebar if it was open
          if (openPropId) { const p = properties.find(x => x.id === openPropId); if (p) showProperty(p); }
        }
        _lastSyncTs = data.ts;
      } catch (e) { /* ignore network errors */ }
    }
    setInterval(pollSync, 3000);

    // === Login ===
    async function checkAuth() {
      try {
        const res = await fetch("/api/auth-check");
        const data = await res.json();
        if (data.loggedIn) { document.getElementById("login-screen").style.display = "none"; return true; }
      } catch(e) {}
      document.getElementById("login-screen").style.display = "flex";
      return false;
    }

    async function doLogin() {
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("login-error");
      errorEl.style.display = "none";
      if (!email || !password) { errorEl.textContent = "メールアドレスとパスワードを入力してください"; errorEl.style.display = "block"; return; }
      const res = await fetch("/api/login", { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ email, password }) });
      const data = await res.json();
      if (data.status === "ok") {
        document.getElementById("login-screen").style.display = "none";
        initApp();
      } else {
        errorEl.textContent = data.message || "ログインに失敗しました";
        errorEl.style.display = "block";
      }
    }

    // Enter key to login
    document.getElementById("login-password").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
    document.getElementById("login-email").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("login-password").focus(); });

    async function initApp() {
      map.invalidateSize();
      await loadWorkspaces();
      const ws = getActiveWs();
      if (ws) {
        renderStations(ws.stations || []);
        if (ws.stations && ws.stations.length > 0) {
          const pts = ws.stations.map(s => [s.lat, s.lon]);
          map.fitBounds(L.latLngBounds(pts).pad(0.3), { maxZoom: 16 });
        } else if (ws.center) {
          map.setView([ws.center.lat, ws.center.lon], ws.zoom || 14);
        }
      }
      await loadProperties();
      await loadAgents();
      renderCriteriaFloat();
      _lastSyncTs = Date.now() / 1000;
    }

    // === Init ===
    requestAnimationFrame(async () => {
      const loggedIn = await checkAuth();
      if (!loggedIn) return;
      await initApp();
    });

  </script>
</body>
</html>
