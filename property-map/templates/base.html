<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}営業クラウド{% endblock %}</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e40af;
      --primary-bg: #eff6ff;
      --ink: #0f172a;
      --sub: #64748b;
      --line: #e2e8f0;
      --bg: #f4f6fa;
      --card: #ffffff;
      --ok: #16a34a;
      --warn: #d97706;
      --danger: #dc2626;
      --radius: 12px;
      --sidebar-w: 220px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--primary); text-decoration: none; }

    /* ===== PC: 左サイドバー / モバイル: ボトムナビ ===== */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: #0f1d40; color: #cbd5e1;
      display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh;
    }
    .brand {
      padding: 18px 16px; font-weight: 800; font-size: 15px; color: #fff;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand .mark {
      width: 26px; height: 26px; border-radius: 7px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 900;
    }
    .brand .portal-tag { font-size: 10px; font-weight: 600; color: #93c5fd; display: block; }
    .nav { flex: 1; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav a {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px;
      color: #cbd5e1; font-size: 13px; font-weight: 600;
    }
    .nav a svg { width: 17px; height: 17px; flex-shrink: 0; }
    .nav a:hover { background: rgba(255,255,255,0.07); color: #fff; }
    .nav a.active { background: var(--primary); color: #fff; }
    .nav .sep { margin: 10px 12px 4px; font-size: 10px; color: #64748b; font-weight: 700; letter-spacing: 0.08em; }
    .userbox {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.08);
      font-size: 12px; line-height: 1.5;
    }
    .userbox .name { color: #fff; font-weight: 700; }
    .userbox .meta { color: #94a3b8; font-size: 11px; }
    .userbox a { color: #93c5fd; font-size: 11px; }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .pagehead {
      position: sticky; top: 0; z-index: 20;
      background: rgba(244,246,250,0.92); backdrop-filter: blur(8px);
      padding: 14px 22px 10px;
      display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--line);
    }
    .pagehead h1 { font-size: 17px; font-weight: 800; flex: 1; }
    .pagehead .sub { font-size: 12px; color: var(--sub); }
    .content { padding: 18px 22px 90px; max-width: 1200px; width: 100%; margin: 0 auto; }

    /* ===== 共通パーツ ===== */
    .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
            padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 12px; }
    .grid { display: grid; gap: 12px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 14px; }
    .kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .kpi .label { font-size: 11px; color: var(--sub); font-weight: 600; }
    .kpi .value { font-size: 24px; font-weight: 800; margin-top: 2px; }
    .kpi .value small { font-size: 12px; color: var(--sub); font-weight: 600; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-dark); }
    .btn.danger { color: var(--danger); }
    .btn.sm { padding: 4px 10px; font-size: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .chip { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 99px;
            background: #f1f5f9; color: #475569; border: 1px solid var(--line); }
    .chip.blue { background: var(--primary-bg); color: var(--primary); border-color: #bfdbfe; }
    .chip.green { background: #f0fdf4; color: var(--ok); border-color: #bbf7d0; }
    .chip.amber { background: #fffbeb; color: var(--warn); border-color: #fde68a; }
    .chip.red { background: #fef2f2; color: var(--danger); border-color: #fecaca; }

    table.list { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.list th { text-align: left; font-size: 11px; color: var(--sub); font-weight: 700;
                    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.list td { padding: 10px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    table.list tr:hover td { background: #f8fafc; }

    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 11px; color: var(--sub); font-weight: 700; }
    .field input, .field select, .field textarea {
      padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 7px;
      font-size: 13px; font-family: inherit; background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,78,216,0.12);
    }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
    .tabs button {
      padding: 9px 16px; background: none; border: none; cursor: pointer;
      font-size: 13px; font-weight: 700; color: var(--sub);
      border-bottom: 2.5px solid transparent; white-space: nowrap;
    }
    .tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

    .empty { text-align: center; padding: 36px 12px; color: #94a3b8; font-size: 13px; }
    .toast {
      position: fixed; bottom: calc(76px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
      background: #0f172a; color: #fff; padding: 10px 20px; border-radius: 8px;
      font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 99;
      max-width: 90vw;
    }
    .toast.show { opacity: 1; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 50;
                align-items: flex-end; justify-content: center; }
    .modal-bg.show { display: flex; }
    .modal { background: #fff; border-radius: 16px 16px 0 0; width: 100%; max-width: 560px;
             max-height: 88vh; overflow-y: auto; padding: 20px; }
    .modal h3 { font-size: 15px; font-weight: 800; margin-bottom: 14px; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

    .bottomnav { display: none; }

    /* ===== モバイル ===== */
    @media (max-width: 760px) {
      .sidebar { display: none; }
      .pagehead { padding: 12px 14px 8px; }
      .pagehead h1 { font-size: 15px; }
      .content { padding: 12px 14px 96px; }
      .kpi .value { font-size: 20px; }
      table.list { display: block; overflow-x: auto; white-space: nowrap; }
      .bottomnav {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
        background: #fff; border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .bottomnav a {
        flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 8px 4px 6px; font-size: 10px; font-weight: 700; color: var(--sub);
      }
      .bottomnav a svg { width: 21px; height: 21px; }
      .bottomnav a.active { color: var(--primary); }
      .modal-bg { align-items: flex-end; }
    }
    @media (min-width: 761px) {
      .modal-bg { align-items: center; }
      .modal { border-radius: 16px; }
    }
    {% block style %}{% endblock %}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="mark">G</span>
        <span>営業クラウド<span class="portal-tag">{% block portal_tag %}{% endblock %}</span></span>
      </div>
      <nav class="nav">{% block sidenav %}{% endblock %}</nav>
      <div class="userbox">
        <div class="name">{{ user.name }}</div>
        <div class="meta" id="userbox-meta">{{ user.email }}</div>
        <a href="/logout">ログアウト</a>
      </div>
    </aside>

    <div class="main">
      <header class="pagehead">
        <h1>{% block pagetitle %}{% endblock %}</h1>
        <span class="sub" id="pagehead-store"></span>
      </header>
      <div class="content">{% block content %}{% endblock %}</div>
    </div>
  </div>

  <nav class="bottomnav">{% block bottomnav %}{% endblock %}</nav>
  <div class="toast" id="toast"></div>

<script>
const ME = {{ user | tojson }};
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2400);
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
async function api(path, opts = {}) {
  if (opts.json) {
    opts.method = opts.method || "POST";
    opts.headers = { "Content-Type": "application/json" };
    opts.body = JSON.stringify(opts.json);
    delete opts.json;
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function yen(v) { return v == null ? "—" : Number(v).toLocaleString() + "円"; }
async function loadStoreName() {
  try {
    const me = await api("/api/me");
    if (me.store_name) document.getElementById("pagehead-store").textContent =
      `${me.store_name}・${me.role_label}`;
  } catch {}
}
loadStoreName();
</script>
{% block script %}{% endblock %}
</body>
</html>
