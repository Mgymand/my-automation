services:
  - type: web
    name: property-map
    runtime: python
    rootDir: property-map
    buildCommand: pip install -r requirements.txt
    startCommand: python init_data.py && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.12"
    disk:
      name: property-data
      mountPath: /data
      sizeGB: 1
