name: fanza-run
description: 公開リポジトリのコードを取得 → 状態ブランチから DB を復元 → affiliate_bot を実行 → DB を保存（失敗時は障害 Issue）
inputs:
  command:
    description: "affiliate_bot に渡す引数（例: ops morning）"
    required: true
  inbox:
    description: "true なら inbox/ の CSV も取り込み、取込済みファイルを削除してコミット"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: コードを取得（公開リポジトリ）
      uses: actions/checkout@v5
      with:
        repository: ${{ env.FANZA_CODE_REPO }}
        ref: ${{ env.FANZA_CODE_REF }}
        path: code
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: code/fanza-affiliate/requirements.txt
    - name: 依存関係
      shell: bash
      run: pip install -q -r code/fanza-affiliate/requirements.txt
    - name: 状態（SQLite）を復元
      shell: bash
      run: bash code/fanza-affiliate/scripts/ops_state.sh pull "$GITHUB_WORKSPACE/state"
    - name: 実行
      shell: bash
      env:
        CMD: ${{ inputs.command }}
        DATA_DIR: ${{ github.workspace }}/state
      working-directory: code/fanza-affiliate
      run: python -m affiliate_bot $CMD
    - name: 受信箱（成果 CSV / 指標 CSV）
      if: inputs.inbox == 'true' && hashFiles('inbox/*.csv') != ''
      shell: bash
      env:
        DATA_DIR: ${{ github.workspace }}/state
      working-directory: code/fanza-affiliate
      run: |
        python -m affiliate_bot ops inbox --dir "$GITHUB_WORKSPACE/inbox" --list-file "$RUNNER_TEMP/ingested.txt"
        cd "$GITHUB_WORKSPACE"
        if [ -s "$RUNNER_TEMP/ingested.txt" ]; then
          git config user.name "fanza-ops"; git config user.email "fanza-ops@users.noreply.github.com"
          while IFS= read -r f; do git rm -q --cached --ignore-unmatch -- "inbox/$(basename "$f")"; rm -f -- "$f"; done < "$RUNNER_TEMP/ingested.txt"
          git commit -q -m "inbox: 取込済み CSV を削除（データは DB に保存済み）" && git push -q origin "HEAD:${GITHUB_REF_NAME}" || true
        fi
    - name: 状態（SQLite）を保存
      if: always()
      shell: bash
      run: bash code/fanza-affiliate/scripts/ops_state.sh push "$GITHUB_WORKSPACE/state"
    - name: 障害を Issue に記録
      if: failure()
      shell: bash
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        n=$(gh issue list --label ops-outage --state open --json number --jq '.[0].number' || true)
        msg="ワークフロー **${GITHUB_WORKFLOW}** が失敗しました: ${RUN_URL}"
        if [ -n "$n" ]; then gh issue comment "$n" --body "$msg"; else
          gh label create ops-outage --color B60205 --force >/dev/null 2>&1 || true
          gh issue create --title "🚨 運用ジョブの失敗" --label ops-outage --body "$msg

        同じ原因が続く場合は、この Issue にまとめて記録されます。直ったら Close してください。"; fi
        if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
          curl -fsS -H 'Content-Type: application/json' -d "{\"content\":\"🚨 運用ジョブ失敗: ${GITHUB_WORKFLOW} ${RUN_URL}\",\"flags\":4}" "$DISCORD_WEBHOOK_URL" || true
        fi
