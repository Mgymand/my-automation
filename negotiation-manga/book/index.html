<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>価格交渉マンガ</title>
<meta name="description" content="『心情・社会的意義からEvidenceにつなげる価格交渉』学習マンガ。本のようにページをめくって読めます。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{--bg:#2b2a2e;--bg2:#1c1b1f;--ink:#f3efe8;--muted:#a8a29a;--acc:#e8622a;--paper:#fbfaf7;--ui:#3a383e;--uiline:#4d4a52;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(ellipse at 50% 40%,var(--bg) 0,var(--bg2) 75%);color:var(--ink);font-family:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px;gap:8px;overflow:hidden;user-select:none;-webkit-user-select:none}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;min-height:36px}
header h1{font-size:14px;font-weight:700;margin:0;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 b{color:var(--acc)}
header .hint{font-size:12px;color:var(--muted);white-space:nowrap}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:2600px;position:relative}
.book{position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,0,.2,1)}
.half{position:absolute;top:0;height:100%;width:50%;background:transparent}
.half.left{left:0;box-shadow:inset -18px 0 26px -20px rgba(0,0,0,.45)}
.half.right{left:50%;box-shadow:inset 18px 0 26px -20px rgba(0,0,0,.45)}
.leaf{position:absolute;left:0;top:0;width:50%;height:100%;transform-origin:right center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,0,.2,1);will-change:transform}
.leaf.flipped{transform:rotateY(180deg)}
.book.single .leaf.flipped:not(.flipping){visibility:hidden}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);overflow:hidden;border-radius:2px}
.face.back{transform:rotateY(-180deg)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.face .shade{position:absolute;inset:0;opacity:0;transition:opacity .45s;pointer-events:none}
.face.front .shade{background:linear-gradient(-90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 55%)}
.face.back .shade{background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(0,0,0,0) 55%)}
.leaf.flipping .face .shade{opacity:1}
.leaf.flipping{z-index:1000!important;box-shadow:0 22px 50px rgba(0,0,0,.5)}
.face.paper{background:var(--paper) repeating-linear-gradient(0deg,rgba(0,0,0,.015) 0 2px,transparent 2px 6px)}
.face.paper::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 12%)}
.spine{position:absolute;left:50%;top:0;width:2px;height:100%;transform:translateX(-1px);background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55),rgba(0,0,0,.35));pointer-events:none;z-index:2000}
.book.single .spine,.book.single .half.right{display:none}
.stage .tap{position:absolute;top:0;height:100%;width:50%;cursor:pointer;z-index:3000}
.stage .tap.l{left:0}.stage .tap.r{right:0}
.stage.single .tap.l{width:80%}.stage.single .tap.r{width:20%}
.book.closed{transform:translateX(25%)}
.book.single.closed{transform:none}
footer{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;font-size:13px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--ui);border:1px solid var(--uiline);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{background:#46434b}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);border-color:var(--acc);color:#1a0e07}
button:disabled{opacity:.4;cursor:default}
.pageno{min-width:110px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:min(360px,50vw);accent-color:var(--acc)}
.toc{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:100%}
.toc button{padding:4px 9px;font-size:12px;border-radius:999px}
.toc button.cur{background:var(--acc);border-color:var(--acc);color:#1a0e07}
.strip{position:absolute;inset:0;overflow:hidden;touch-action:pan-y;cursor:grab}
.strip.dragging{cursor:grabbing}
.strip .slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transition:transform .48s cubic-bezier(.2,.75,.2,1),filter .48s,opacity .48s;will-change:transform}
.strip.dragging .slide{transition:none}
.strip .slide img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;box-shadow:0 14px 44px rgba(0,0,0,.55);background:var(--paper);border-radius:3px}
.strip .slide.gone{transform:translateX(112%) rotate(1.5deg);opacity:.98}
.strip .slide.under{transform:scale(.955);filter:brightness(.78)}
.strip .slide.under img{box-shadow:0 6px 24px rgba(0,0,0,.3)}
.strip .slide.hiddenpage{visibility:hidden}
.stage.slide .tap{display:none}
.seg{display:inline-flex;border:1px solid var(--uiline);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 12px}
.seg button+button{border-left:1px solid var(--uiline)}
.seg button.on{background:var(--acc);color:#1a0e07}
@media (max-width:640px){header .hint{display:none}.toc{display:none}.pageno{min-width:80px}}
@media (prefers-reduced-motion:reduce){.leaf,.book{transition-duration:.01s}}
</style>
</head>
<body>
<header>
  <h1>心情・社会的意義から<b>Evidence</b>につなげる価格交渉　<span style="font-weight:500;color:var(--muted)">学習マンガ</span></h1>
  <div class="hint">ページを右へスワイプ（またはページの左側をクリック／← キー）すると、下から次のページが現れます。表示は下のボタンで切替</div>
</header>
<div class="stage" id="stage">
  <div class="strip" id="strip" hidden></div>
  <div class="book" id="book"><div class="half left"></div><div class="half right"></div><div class="spine"></div></div>
  <div class="tap l" id="tapL" title="次のページ"></div>
  <div class="tap r" id="tapR" title="前のページ"></div>
</div>
<footer>
  <button id="btnNext" class="primary">◀ 次のページ</button>
  <div class="pageno" id="pageno"></div>
  <button id="btnPrev">前のページ ▶</button>
  <input type="range" id="slider" min="0" max="1" value="0" aria-label="ページ">
  <button id="btnFirst" title="表紙へ">表紙</button>
  <span class="seg" role="group" aria-label="表示方法">
    <button data-mode="slide" title="横にスライドして読む">スライド</button>
    <button data-mode="single" title="1ページずつめくる">片開き</button>
    <button data-mode="spread" title="2ページ見開きでめくる">見開き</button>
  </span>
  <button id="btnFull" title="全画面">全画面</button>
</footer>
<nav class="toc" id="toc" aria-label="目次"></nav>
<script>
const PAGES = Array.from({length:12},(_,i)=>`pages/${String(i+1).padStart(2,'0')}.jpg`);
const TOC = [[0,'表紙'],[1,'基本'],[2,'PHASE1'],[3,'PHASE2'],[4,'STEP3-4'],[5,'STEP5-7'],[6,'PHASE3-4'],[7,'PHASE5'],[8,'PHASE6'],[10,'PHASE7-8'],[11,'まとめ']];
const book=document.getElementById('book'), stage=document.getElementById('stage'), strip=document.getElementById('strip');
let mode='slide', leaves=[], state=0, maxState=0, animating=false, lastSwipe=0, animTimer=null;
const isFlip=()=>mode!=='slide';

/* ---------- スライド表示（重ねたページを横にずらす） ---------- */
PAGES.forEach((src,i)=>{ const d=document.createElement('div'); d.className='slide'; d.dataset.i=i; d.style.zIndex=200-i; const im=new Image(); im.src=src; im.alt=`ページ ${i+1}`; im.decoding='async'; im.draggable=false; d.appendChild(im); strip.appendChild(d); });
const slides=[...strip.children];
function renderStack(){
  slides.forEach((el,i)=>{
    el.style.transform=''; el.style.filter='';
    el.classList.toggle('gone', i<state);
    el.classList.toggle('under', i===state+1);
    el.classList.toggle('hiddenpage', i>state+1);   // 2枚下以降は描かない（軽量化）
  });
}
let drag=null;
strip.addEventListener('pointerdown',e=>{
  if(mode!=='slide') return;
  drag={x0:e.clientX,y0:e.clientY,t0:performance.now(),dx:0,moved:false,W:strip.getBoundingClientRect().width};
  strip.setPointerCapture(e.pointerId);
});
strip.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(!drag.moved){ if(Math.abs(dx)<8) return; if(Math.abs(dy)>Math.abs(dx)) { drag=null; return; } drag.moved=true; strip.classList.add('dragging'); if(state+2<slides.length) slides[state+2].classList.remove('hiddenpage'); }
  drag.dx=dx;
  const W=drag.W, top=slides[state], under=slides[state+1], prevEl=slides[state-1];
  if(dx>=0){                                   // 右へ：今のページがずれて、下から次のページ
    if(!under){ top.style.transform=`translateX(${dx*0.25}px)`; return; }
    const p=Math.min(1,dx/W);
    top.style.transform=`translateX(${dx}px) rotate(${1.5*p}deg)`;
    under.style.transform=`scale(${.955+.045*p})`; under.style.filter=`brightness(${.78+.22*p})`;
  } else {                                      // 左へ：前のページが右から戻ってくる
    if(!prevEl){ top.style.transform=`translateX(${dx*0.25}px)`; return; }
    const p=Math.min(1,-dx/W);
    prevEl.style.transform=`translateX(${W*1.12+dx}px) rotate(${1.5*(1-p)}deg)`;
    top.style.transform=`scale(${1-.045*p})`; top.style.filter=`brightness(${1-.22*p})`;
  }
});
function endStackDrag(e){
  if(!drag) return;
  const d=drag; drag=null;
  strip.classList.remove('dragging'); void strip.offsetWidth;
  if(!d.moved){ // タップ：左側＝次、右側＝前
    const r=stage.getBoundingClientRect(); const rel=(e.clientX-r.left)/r.width;
    if(rel<0.5) next(); else prev(); return;
  }
  const v=d.dx/Math.max(1,performance.now()-d.t0);
  lastSwipe=Date.now();
  if(d.dx>d.W*0.18 || (d.dx>60 && v>0.45)) go(state+1);
  else if(d.dx<-d.W*0.18 || (d.dx<-60 && v<-0.45)) go(state-1);
  else renderStack();
}
strip.addEventListener('pointerup',endStackDrag); strip.addEventListener('pointercancel',endStackDrag);
let wheelLock=0;
strip.addEventListener('wheel',e=>{ if(mode!=='slide') return; e.preventDefault(); const now=Date.now(); if(now-wheelLock<550) return; wheelLock=now; const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:-e.deltaX; if(d>0) next(); else prev(); },{passive:false});

/* ---------- めくり表示 ---------- */
function buildLeaves(){
  leaves.forEach(l=>l.el.remove()); leaves=[];
  const mk=(front, back)=>{
    const el=document.createElement('div'); el.className='leaf';
    const f=document.createElement('div'); f.className='face front'+(front==null?' paper':'');
    const b=document.createElement('div'); b.className='face back'+(back==null?' paper':'');
    if(front!=null){const i=new Image(); i.src=PAGES[front]; i.alt=`ページ ${front+1}`; i.decoding='async'; f.appendChild(i);}
    if(back!=null){const i=new Image(); i.src=PAGES[back]; i.alt=`ページ ${back+1}`; i.decoding='async'; b.appendChild(i);}
    f.insertAdjacentHTML('beforeend','<div class="shade"></div>'); b.insertAdjacentHTML('beforeend','<div class="shade"></div>');
    el.append(f,b); book.appendChild(el);
    el.addEventListener('transitionend',()=>{ el.classList.remove('flipping'); animating=false; zsort(); });
    return {el, front, back};
  };
  if(mode==='spread'){
    leaves.push(mk(0,null));
    for(let k=1;k<=5;k++) leaves.push(mk(2*k-1, 2*k));
    leaves.push(mk(11,null));
    maxState=6;
  } else {
    for(let i=0;i<PAGES.length;i++) leaves.push(mk(i,null));
    maxState=PAGES.length-1;
  }
  book.classList.toggle('single', mode==='single'); stage.classList.toggle('single', mode==='single');
}
function zsort(){ const n=leaves.length; leaves.forEach((l,i)=>{ l.el.style.zIndex = i<state ? (10+i) : (10+n-i); }); }
function stateForPage(p){
  if(mode!=='spread') return p;
  if(p===0) return 0;
  for(let s=1;s<=maxState;s++){ const r=leaves[s-1].back, l=leaves[s]?leaves[s].front:null; if(l===p||r===p) return s; }
  return maxState;
}
function currentPage(){ if(mode!=='spread') return state; if(state===0) return 0; return leaves[state]?leaves[state].front:leaves[state-1].back; }
function pageLabel(){
  const name=(p)=>p==null?'':`P${p+1}`;
  if(mode==='spread'){
    if(state===0) return '表紙';
    const r=leaves[state-1].back, l=leaves[state]?leaves[state].front:null;
    return [name(r),name(l)].filter(Boolean).join(' – ')+` ／ 全${PAGES.length}p`;
  }
  return (state===0?'表紙':name(state))+` ／ 全${PAGES.length}p`;
}
function updateUI(){
  document.getElementById('pageno').textContent=pageLabel();
  const sl=document.getElementById('slider'); sl.max=maxState; sl.value=state;
  document.getElementById('btnNext').disabled = state>=maxState;
  document.getElementById('btnPrev').disabled = state<=0;
  const cur=currentPage();
  document.querySelectorAll('#toc button').forEach(b=>{ const p=+b.dataset.p, nxt=+b.dataset.next; b.classList.toggle('cur', cur>=p && cur<nxt); });
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on', b.dataset.mode===mode));
}
function render(){
  if(isFlip()){ leaves.forEach((l,i)=>l.el.classList.toggle('flipped', i<state)); zsort(); book.classList.toggle('closed', state===0 && mode==='spread'); }
  updateUI();
}
function go(target){
  target=Math.max(0,Math.min(maxState,target));
  if(target===state) return;
  if(mode==='slide'){ state=target; renderStack(); updateUI(); return; }
  const step = target>state ? 1 : -1;
  const leaf = step>0 ? leaves[state] : leaves[state-1];
  if(Math.abs(target-state)===1 && leaf){ leaf.el.classList.add('flipping'); animating=true; clearTimeout(animTimer); animTimer=setTimeout(()=>{animating=false; leaf.el.classList.remove('flipping'); zsort();},1100); }
  state=target; render();
}
const recentSwipe=()=>Date.now()-lastSwipe<450;
const next=()=>{ if(!animating) go(state+1); };
const prev=()=>{ if(!animating) go(state-1); };

function size(){
  const rect=stage.getBoundingClientRect();
  const pad=4, availW=rect.width-pad*2, availH=rect.height-pad*2;
  if(!isFlip()) return;
  let pw = mode==='spread' ? Math.min(availW/2, availH*2/3) : Math.min(availW, availH*2/3);
  pw=Math.floor(pw); const ph=Math.floor(pw*1.5);
  book.style.width=(mode==='spread'?pw*2:pw)+'px'; book.style.height=ph+'px';
  leaves.forEach(l=>{ l.el.style.left='0'; l.el.style.width= mode==='single' ? '100%' : '50%'; });
}
function setMode(m){
  const p=currentPage(); mode=m;
  stage.classList.toggle('slide', mode==='slide');
  if(mode==='slide'){
    leaves.forEach(l=>l.el.remove()); leaves=[]; book.hidden=true; strip.hidden=false;
    maxState=PAGES.length-1; state=p; strip.classList.add('dragging'); renderStack(); void strip.offsetWidth; strip.classList.remove('dragging'); updateUI();
  } else {
    strip.hidden=true; book.hidden=false; buildLeaves(); state=stateForPage(p); size(); render();
  }
  try{ localStorage.setItem('manga-mode', mode); }catch(e){}
}
/* ---------- 操作 ---------- */
const toc=document.getElementById('toc');
TOC.forEach(([p,name],i)=>{ const b=document.createElement('button'); b.textContent=name; b.dataset.p=p; b.dataset.next=TOC[i+1]?TOC[i+1][0]:99; b.addEventListener('click',()=>{ if(animating) return; go(stateForPage(p)); }); toc.appendChild(b); });
document.getElementById('btnNext').addEventListener('click',next);
document.getElementById('btnPrev').addEventListener('click',prev);
document.getElementById('btnFirst').addEventListener('click',()=>{ if(!animating) go(0); });
document.getElementById('tapL').addEventListener('click',()=>{ if(!recentSwipe()) next(); });
document.getElementById('tapR').addEventListener('click',()=>{ if(!recentSwipe()) prev(); });
document.getElementById('slider').addEventListener('input',e=>{ go(+e.target.value); });
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('btnFull').addEventListener('click',async()=>{ try{ if(document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen(); }catch(e){} });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'||e.key===' '||e.key==='PageDown'){e.preventDefault();next();} else if(e.key==='ArrowRight'||e.key==='PageUp'){e.preventDefault();prev();} else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(maxState);} });
let sx=null, sy=null;
stage.addEventListener('pointerdown',e=>{ if(mode==='slide') return; sx=e.clientX; sy=e.clientY; });
stage.addEventListener('pointerup',e=>{ if(sx==null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=sy=null; if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3){ lastSwipe=Date.now(); if(dx>0) next(); else prev(); } });
window.addEventListener('resize',()=>{ if(isFlip()) size(); });
PAGES.forEach(p=>{ const i=new Image(); i.src=p; });
let saved=null; try{ saved=localStorage.getItem('manga-mode'); }catch(e){}
setMode(['slide','single','spread'].includes(saved)?saved:'slide');
</script>

</body>
</html>
