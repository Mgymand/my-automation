<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23ff6b9a%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 font-weight=%27900%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27serif%27%3E孫%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/app.css?v=9">
</head>
<body data-scene="hall">
<div class="world-bg"><canvas id="stars"></canvas></div>
<div class="scene-bg" id="scene-bg"></div>
<div class="layout">
  <!-- サイドバーはスマホのメニュー用に残す（PCでは非表示・移動は「移動」オーバーレイ） -->
  <aside class="sidebar" id="sidebar" hidden></aside>

  <main class="main">
    <header class="topbar">
      <a class="home-btn" href="#/dashboard" id="home-btn" title="ギルドホールへ戻る"><span class="brand-mark" id="brand-mark">孫</span><span class="home-text"><b>孫LOVE</b><small>ギルドホール</small></span></a>
      <div class="topbar-title" id="view-title">ギルドホール</div>
      <div class="topbar-search">
        <input id="global-search" type="search" placeholder="物件名・住所・担当で検索…（/ でフォーカス）">
      </div>
      <div class="topbar-actions">
        <button class="btn" id="btn-travel">🧭 移動</button>
        <button class="btn btn-primary" id="btn-new-property">＋ 物件を追加</button>
        <div class="user-chip" title="レベル"><div class="avatar">{{ user.name[:1] }}</div><div class="user-meta"><div class="user-name">{{ user.name }}</div><div class="user-role" id="lv-mini">Lv.1</div></div></div>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<!-- 移動オーバーレイ（部屋の中の行き先を選ぶ） -->
<div class="travel" id="travel" hidden>
  <div class="travel-inner">
    <div class="travel-head"><div class="travel-title">🧭 どこへ行く？</div><button class="icon-btn" id="travel-close">✕</button></div>
    <div class="travel-grid" id="travel-grid"></div>
  </div>
</div>

<!-- パートナー（キャラクター）ウィジェット -->
<div class="partner" id="partner" hidden>
  <div class="bubble" id="partner-bubble"><button class="bubble-close" id="partner-close" title="閉じる">✕</button><span id="partner-text"></span><button class="bubble-next" id="partner-next" title="次のセリフ">▶</button></div>
  <button class="partner-avatar" id="partner-avatar" title="パートナー（クリックで話す）"><img id="partner-img" alt="" hidden><span id="partner-emoji"></span></button>
</div>

<!-- モバイル ボトムナビ -->
<nav class="bottom-nav" id="bottom-nav">
  <a href="#/dashboard" data-view="dashboard"><span>🏰</span>ホール</a>
  <a href="#/map" data-view="map"><span>🗺️</span>マップ</a>
  <a href="#/board" data-view="board"><span>📜</span>クエスト</a>
  <a href="#/schedule" data-view="schedule"><span>🕰️</span>暦</a>
  <a href="#" id="bn-more"><span>🧭</span>移動</a>
</nav>

<!-- 物件詳細ドロワー -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<!-- 汎用モーダル -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-title" id="modal-title"></div><button class="icon-btn" id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>
<div class="level-box" id="level-box" hidden><div class="level-row"><span class="lv" id="lv-num"></span><span class="lv-title" id="lv-title"></span></div><div class="progress xp"><i id="xp-bar"></i></div><div class="lv-xp" id="lv-xp"></div></div>

<script>
  window.__USER = {{ user | tojson }};
  window.__GOOGLE_CLIENT_ID = {{ google_client_id | tojson }};
</script>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/stars.js?v=3"></script>
<script src="/static/app.js?v=9"></script>
</body>
</html>
