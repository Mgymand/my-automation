<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%23e0475b%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 font-weight=%27900%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27%3E孫%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="/static/vendor/markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="/static/app.css?v=2">
</head>
<body>
<div class="layout">
  <!-- ===== サイドバー ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">孫</div>
      <div class="brand-text">
        <div class="brand-name">孫LOVE</div>
        <div class="brand-sub">老人ホーム出店管理</div>
      </div>
    </div>
    <nav class="nav">
      <a href="#/dashboard" data-view="dashboard"><span class="ico">📊</span>ダッシュボード</a>
      <a href="#/map" data-view="map"><span class="ico">🗺️</span>マップ</a>
      <a href="#/board" data-view="board"><span class="ico">🗂️</span>パイプライン</a>
      <a href="#/list" data-view="list"><span class="ico">📋</span>物件一覧</a>
      <a href="#/schedule" data-view="schedule"><span class="ico">📅</span>スケジュール</a>
      <div class="nav-sep">データ</div>
      <a href="#/import" data-view="import"><span class="ico">📥</span>取込（PDF/CSV）</a>
      <a href="#/pois" data-view="pois"><span class="ico">🏥</span>周辺施設</a>
      <a href="#/stats" data-view="stats"><span class="ico">📈</span>統計データ</a>
      <div class="nav-sep">管理</div>
      <a href="#/settings" data-view="settings"><span class="ico">⚙️</span>設定・連携</a>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="user-avatar">{{ user.name[:1] }}</div>
        <div class="user-meta">
          <div class="user-name">{{ user.name }}</div>
          <div class="user-role" id="user-role">{{ user.role }}</div>
        </div>
      </div>
      <a class="logout" href="/logout" title="ログアウト">⎋</a>
    </div>
    <div class="level-box" id="level-box" title="タスク完了・報告・ステータス更新で経験値がたまります">
      <div class="level-row"><span class="lv" id="lv-num">Lv.1</span><span class="lv-title" id="lv-title">見習い出店担当</span></div>
      <div class="progress xp"><i id="xp-bar" style="width:0%"></i></div>
      <div class="lv-xp" id="lv-xp"></div>
    </div>
  </aside>

  <!-- ===== メイン ===== -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="メニュー">☰</button>
      <div class="topbar-title" id="view-title">ダッシュボード</div>
      <div class="topbar-search">
        <input id="global-search" type="search" placeholder="物件名・住所・担当で検索…（/ でフォーカス）">
      </div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="btn-new-property">＋ 物件を追加</button>
      </div>
    </header>
    <section class="view" id="view"></section>
  </main>
</div>

<!-- パートナー（キャラクター）ウィジェット -->
<div class="partner" id="partner" hidden>
  <div class="bubble" id="partner-bubble"><button class="bubble-close" id="partner-close" title="閉じる">✕</button><span id="partner-text"></span><button class="bubble-next" id="partner-next" title="次のセリフ">▶</button></div>
  <button class="partner-avatar" id="partner-avatar" title="パートナー（クリックで話す）"></button>
</div>

<!-- モバイル ボトムナビ -->
<nav class="bottom-nav" id="bottom-nav">
  <a href="#/dashboard" data-view="dashboard"><span>🏠</span>ホーム</a>
  <a href="#/map" data-view="map"><span>🗺️</span>マップ</a>
  <a href="#/board" data-view="board"><span>🗂️</span>案件</a>
  <a href="#/schedule" data-view="schedule"><span>📅</span>予定</a>
  <a href="#" id="bn-more"><span>☰</span>メニュー</a>
</nav>

<!-- 物件詳細ドロワー -->
<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden></aside>

<!-- 汎用モーダル -->
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><div class="modal-title" id="modal-title"></div><button class="icon-btn" id="modal-close">✕</button></div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
  window.__USER = {{ user | tojson }};
  window.__GOOGLE_CLIENT_ID = {{ google_client_id | tojson }};
</script>
<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/markercluster/leaflet.markercluster.js"></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="/static/app.js?v=2"></script>
</body>
</html>
